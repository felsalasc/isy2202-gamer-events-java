services:
  gamer-events:
    build: .
    container_name: gamer-events-app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - SERVER_ADDRESS=0.0.0.0
      - SPRING_PROFILES_ACTIVE=demo
      - GAMER_DEMO_PASSWORD=${GAMER_DEMO_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./data:/app/data
