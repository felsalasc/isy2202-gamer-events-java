spring.application.name=gamer-events
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gamer_events}
spring.datasource.username=${DB_USERNAME:gamer_events}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false

# Secreto HS256 de los tokens JWT (mínimo 32 bytes). Sin él la aplicación no arranca.
app.jwt.secret=${JWT_SECRET:}
