<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Crear cuenta')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="contenido" class="container form-layout">
    <section class="form-intro"><p class="eyebrow">Hay lugar para ti</p><h1>Encuentra<br>tu equipo.</h1><p class="muted">Una cuenta para descubrir encuentros y compartir tus juegos favoritos.</p></section>
    <section class="panel" aria-labelledby="titulo"><h2 id="titulo">Crear cuenta</h2>
        <form th:action="@{/registro}" th:object="${registration}" method="post">
            <div class="alert error" role="alert" th:if="${#fields.hasErrors('*')}"><p>Revisa los datos del formulario.</p><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
            <label for="name">Nombre</label><input id="name" th:field="*{name}" required minlength="2" maxlength="80" autocomplete="name">
            <label for="email">Correo electrónico</label><input id="email" th:field="*{email}" type="email" required maxlength="254" autocomplete="email">
            <label for="password">Contraseña</label><input id="password" name="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password" aria-describedby="password-help">
            <p id="password-help" class="field-help">Desde 12 caracteres y hasta 72 bytes. Puedes usar una frase larga; tildes y emojis ocupan más bytes.</p>
            <label for="confirmPassword">Repetir contraseña</label><input id="confirmPassword" name="confirmPassword" type="password" required maxlength="72" autocomplete="new-password">
            <button class="button full-width" type="submit">Crear mi cuenta</button>
        </form><p class="muted">¿Ya tienes cuenta? <a th:href="@{/login}">Ingresa aquí</a>.</p>
    </section>
</main><footer th:replace="~{fragments :: footer}"></footer>
</body></html>
