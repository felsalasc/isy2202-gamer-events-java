<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${event.title})}"></head>
<body><header th:replace="~{fragments :: header}"></header>
<main id="contenido" class="container page-main">
    <a class="text-link" th:href="@{/eventos}">← Volver a eventos</a>
    <p class="eyebrow" th:text="|${event.category} · ${event.modality.label}|"></p><h1 class="page-title" th:text="${event.title}"></h1>
    <img class="event-hero" th:src="@{${event.imageUrl}}" th:alt="|Imagen del evento ${event.title}|" width="320" height="180">
    <div class="event-detail">
        <section class="panel" aria-label="Información del evento">
            <h2>Acerca del encuentro</h2><p th:text="${event.description}"></p>
            <h2>Requisitos de participación</h2><p th:text="${event.requirements}"></p>
            <h2>Información de inscripción</h2><p th:text="${event.registrationInfo}"></p>
            <h2>Organizadores</h2><p th:text="${event.organizers}"></p>
            <h2>Servicios disponibles</h2><p th:text="${event.services}"></p>
            <h2>Principales expositores</h2><p th:text="${event.exhibitors}"></p>
        </section>
        <aside class="panel" aria-labelledby="datos"><h2 id="datos">Planifica tu visita</h2><dl>
            <dt>Videojuego</dt><dd th:text="${event.game}"></dd>
            <dt>Modalidad</dt><dd th:text="${event.modality.label}"></dd>
            <dt>Fecha</dt><dd th:text="${#temporals.format(event.startsAt, 'dd/MM/yyyy')}"></dd>
            <dt>Hora local de Chile</dt><dd th:text="${#temporals.format(event.startsAt, 'HH:mm')}"></dd>
            <th:block th:unless="${event.online}">
                <dt>Ubicación</dt><dd th:text="|${event.location}, ${event.country}|"></dd>
                <dt>Dirección</dt><dd th:text="${event.address}"></dd>
            </th:block>
            <th:block th:if="${event.online}">
                <dt>País organizador</dt><dd th:text="${event.country}"></dd>
                <dt>Enlace de acceso</dt>
                <dd><a class="text-link" th:href="${event.accessUrl}" th:text="${event.accessUrl}" target="_blank" rel="noopener noreferrer"></a></dd>
            </th:block>
        </dl></aside>
    </div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
