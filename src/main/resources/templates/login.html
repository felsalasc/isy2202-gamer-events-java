<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ingresar')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="contenido" class="container form-layout">
    <section class="form-intro"><p class="eyebrow">De vuelta en la partida</p><h1>Tu comunidad<br>te espera.</h1><p class="muted">Ingresa para explorar cada evento y personalizar tu perfil.</p></section>
    <section class="panel" aria-labelledby="titulo">
        <h2 id="titulo">Iniciar sesión</h2>
        <p class="alert error" role="alert" th:if="${param.error}">Correo o contraseña incorrectos.</p>
        <p class="alert success" role="status" th:if="${param.logout}">Cerraste tu sesión correctamente.</p>
        <p class="alert success" role="status" th:if="${param.registrado}">Tu cuenta está lista. Ya puedes ingresar.</p>
        <form th:action="@{/login}" method="post">
            <label for="email">Correo electrónico</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username">
            <label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password">
            <button class="button full-width" type="submit">Ingresar</button>
        </form>
        <p class="muted">¿Primera vez aquí? <a th:href="@{/registro}">Crea tu cuenta</a>.</p>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body></html>
